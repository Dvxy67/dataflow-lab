apiVersion: 1
groups:
    - orgId: 1
      name: flux
      folder: dataflow-lab
      interval: 30s
      rules:
        - uid: dg3wajd601g5cd
          title: Aucun consommateur sur la file flux
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: sum(rabbitmq_queue_consumers)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 1m
          annotations:
            description: 'Les messages s''accumulent dans RabbitMQ sans être traités. Vérifier que n8n tourne : docker compose ps'
            summary: Plus aucun consommateur sur la file flux
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
